name: Deployment controller checks
on:
  push:
    paths: ['deploy/ubuntu/**', '.github/workflows/deployment-checks.yml']
  pull_request:
    paths: ['deploy/ubuntu/**', '.github/workflows/deployment-checks.yml']
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n deploy/ubuntu/install.sh && sh -n deploy/ubuntu/exam-deploy
      - run: python -m unittest discover -s deploy/ubuntu/tests -v
