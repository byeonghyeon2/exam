[project]
name = "cert-exam-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pymysql>=1.1", "alembic>=1.13", "pydantic-settings>=2.5", "python-multipart>=0.0.9", "openai>=1.50", "webauthn>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E701", "E702", "E401", "F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
ignore_errors = true
sqlite_cache = false

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
