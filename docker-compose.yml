services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-cert_exam}
      MYSQL_USER: ${DATABASE_USER:-cert_exam_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_URL: mysql+pymysql://${DATABASE_USER:-cert_exam_user}:${DATABASE_PASSWORD:-change-me}@mysql:3306/${DATABASE_NAME:-cert_exam}?charset=utf8mb4
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:

